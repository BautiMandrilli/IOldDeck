<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mi panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1 id="title">Mi panel</h1><span id="status" class="status">Conectando</span></header>
  <section id="pair" class="pair" style="display:none">
    <h2>Vincular iPad</h2>
    <p>Escribí el código de 6 números que aparece en la consola de Windows.</p>
    <form id="pair-form">
      <input id="pair-code" type="tel" pattern="[0-9]*" maxlength="6" placeholder="Código" autocomplete="off">
      <button type="submit">Conectar</button>
    </form>
    <p id="pair-error" role="status"></p>
  </section>
  <main id="pages"></main>
  <nav id="tabs"></nav>
  <div id="message" class="message" role="status"></div>
  <script src="/layout.js"></script>
  <script src="/spotify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
