<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor · Mi panel</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/editor.css">
</head>
<body class="editor-body">
  <main class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="Panel y páginas">
      <div class="sidebar-content">
      <section class="group">
        <h2 class="group-title">Panel</h2>
        <div class="group-card"><label class="field"><span class="field-label">Nombre del panel</span><input id="panel-title" maxlength="60"></label></div>
      </section>
      <section class="group">
        <h2 class="group-title">Tema</h2>
        <div id="theme-list" class="theme-list" role="group" aria-label="Tema del panel"></div>
      </section>
      <section class="group">
        <div class="group-header">
          <h2 class="group-title">Páginas</h2>
          <div class="mini-actions">
            <button id="page-up" type="button" class="mini-button" title="Subir página" aria-label="Subir página"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="page-down" type="button" class="mini-button" title="Bajar página" aria-label="Bajar página"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="delete-page" type="button" class="mini-button" title="Eliminar página" aria-label="Eliminar página"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button id="add-page" type="button" class="mini-button" title="Nueva página" aria-label="Nueva página"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
        </div>
        <div id="page-list" class="source-list" role="listbox" aria-label="Páginas"></div>
      </section>
      <section class="group">
        <h2 class="group-title">Página seleccionada</h2>
        <div id="page-controls" class="group-card"></div>
      </section>
      <section class="group">
        <h2 class="group-title">Llevar a otra PC</h2>
        <div class="group-card">
          <button id="export-backup" type="button" class="edit-button full">Exportar personalización</button>
          <label class="upload-button">Importar respaldo ZIP<input id="import-backup" type="file" accept=".zip,application/zip"></label>
          <div id="restore-preview" role="status"></div>
        </div>
      </section>
      </div>
    </aside>
    <div class="sidebar-resizer" data-side="left" role="separator" aria-orientation="vertical" aria-label="Ancho de la barra de páginas" aria-controls="sidebar" tabindex="0" title="Arrastrá para cambiar el ancho · clic para ocultar"><span class="resizer-grip"></span></div>
    <section class="stage" aria-label="Vista previa">
      <header class="stage-bar toolbar">
        <div class="toolbar-leading">
          <button id="toggle-sidebar" type="button" class="tool-button sidebar-toggle" title="Ocultar barra de páginas (Ctrl+Alt+[)" aria-label="Ocultar barra de páginas" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 4.5v15" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 8h1.5M5.5 11h1.5M5.5 14h1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <span class="app-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z" fill="currentColor"/></svg></span>
          <div class="toolbar-titles">
            <strong>Panel Propio</strong>
            <span id="save-state" class="save-state"><span class="save-dot"></span><span class="save-text">Cargando…</span></span>
          </div>
        </div>
        <div id="folder-navigation" class="breadcrumb"></div>
        <div class="toolbar-trailing">
          <a href="/" class="toolbar-link" target="_blank" rel="noopener" title="Abrir el panel del iPad en una pestaña nueva para probarlo">Probar panel</a>
          <button id="save" type="button" class="edit-button primary" title="Guardar (Ctrl+S)">Guardar</button>
          <button id="toggle-inspector" type="button" class="tool-button sidebar-toggle" title="Ocultar inspector (Ctrl+Alt+])" aria-label="Ocultar inspector" aria-controls="inspector" aria-expanded="true"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 4.5v15" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 8h1.5M17 11h1.5M17 14h1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <div class="insert-dock" role="group" aria-label="Agregar al panel">
        <button id="add-button" type="button" class="insert-button is-primary" title="Agregar un botón nuevo"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect x="3" y="6" width="22" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/><g class="plus-badge"><circle cx="24" cy="24" r="7.5"/><path d="M24 20.5v7M20.5 24h7"/></g></svg><span>Nuevo botón</span></button>
        <button id="add-folder" type="button" class="insert-button" title="Agregar una carpeta para agrupar botones"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h6l2.5 2.5H23a2 2 0 0 1 2 2V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><g class="plus-badge"><circle cx="24" cy="24" r="7.5"/><path d="M24 20.5v7M20.5 24h7"/></g></svg><span>Nueva carpeta</span></button>
        <button id="add-spotify" type="button" class="insert-button is-spotify" title="Agregar el widget de Spotify (canción, portada y controles)"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><g transform="translate(1 1)"><circle cx="12" cy="12" r="12" fill="#1ED760"/><path d="M17.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" fill="#000"/></g><g class="plus-badge"><circle cx="24" cy="24" r="7.5"/><path d="M24 20.5v7M20.5 24h7"/></g></svg><span>Widget de Spotify</span></button>
      </div>
      <div class="stage-scroll">
        <div class="device-frame">
          <div id="preview-shell" class="preview-shell"><div id="preview-canvas" class="dashboard-canvas"></div></div>
        </div>
        <p id="stage-hint" class="stage-hint"></p>
      </div>
      <div id="action-dock" class="action-dock" role="toolbar" aria-label="Acciones">
        <div class="dock-group">
          <button id="undo" type="button" class="dock-button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Deshacer</span></button>
          <button id="redo" type="button" class="dock-button" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rehacer</span></button>
        </div>
        <div class="dock-group dock-item-actions">
          <button id="dock-duplicate" type="button" class="dock-button" title="Duplicar (Ctrl+D)" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 8h11v11H8z M5 16V5h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Duplicar</span></button>
          <button id="dock-before" type="button" class="dock-button" title="Mover un lugar a la izquierda" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Mover a la izquierda</span></button>
          <button id="dock-after" type="button" class="dock-button" title="Mover un lugar a la derecha" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Mover a la derecha</span></button>
          <button id="dock-delete" type="button" class="dock-button danger" title="Eliminar (Supr)" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16 M10 11v6 M14 11v6 M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12 M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Eliminar</span></button>
        </div>
      </div>
      <p id="editor-message" class="statusbar" role="status" aria-live="polite"></p>
    </section>
    <div class="sidebar-resizer" data-side="right" role="separator" aria-orientation="vertical" aria-label="Ancho del inspector" aria-controls="inspector" tabindex="0" title="Arrastrá para cambiar el ancho · clic para ocultar"><span class="resizer-grip"></span></div>
    <aside id="inspector" class="sidebar inspector" aria-label="Inspector">
      <div id="button-controls" class="button-inspector"></div>
    </aside>
  </main>
  <script src="/motion.js"></script>
  <script src="/app-icons.js"></script>
  <script src="/layout.js"></script>
  <script src="/designer.js"></script>
</body>
</html>
